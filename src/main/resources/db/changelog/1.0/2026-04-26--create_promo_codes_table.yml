databaseChangeLog:
  - changeSet:
      id: 4
      author: elnur.ahmadov
      changes:
        - createTable:
            tableName: promo_codes
            schemaName: product
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: discount_percent
                  type: numeric(5,2)
                  constraints:
                    nullable: false
              - column:
                  name: expire_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: promo_codes
            schemaName: product